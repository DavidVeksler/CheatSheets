# Daily popularity refresh, published to the cheatsheets-davidveksler-com Worker.
# Pre-authorized auto-publish (David, 2026-09-27). Logic and guard:
# scripts/popularity-publish-cloudflare.sh; spec: docs/specs/cloudflare-migration.md §2.5.
#
# Live since the 2026-09-28 cutover: runs nightly and publishes to the routed Worker.
# It replaced update-popularity.yml (deleted in the same commit) and the droplet crons
# cheatsheets-pull.sh and the referrer accumulator (both removed; the referrer feature
# was dropped 2026-09-28). A manual run
# defaults to a dry run; pass dry_run=false to publish.
#
# Secrets:
#   CLOUDFLARE_API_TOKEN      existing: Zone Analytics Read (fetch-popularity.py)
#   CLOUDFLARE_WORKERS_TOKEN  Cloudflare token 2b68fae6... ("CheatSheets GitHub Actions:
#                             popularity deploy"), Workers Scripts Edit on this account only
name: popularity-cloudflare

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: refresh, gate and build only (no commit, push or publish)"
        type: boolean
        default: true
  # 02:30 UTC, update-popularity.yml's old slot.
  schedule:
    - cron: "30 2 * * *"

concurrency:
  group: popularity-cloudflare
  cancel-in-progress: false

permissions:
  contents: write   # commits popularity.json + catalog.json to main

jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # build_catalog.py dates every sheet from git history, and the publish
          # guard diffs against the live Worker's commit.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install --upgrade pip beautifulsoup4
      # The build prerenders index.php/popularity.php/sitemap.php with PHP CLI.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: none
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Refresh and publish
        run: bash scripts/popularity-publish-cloudflare.sh
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: 3d96473d69977c5c828b3079d9b9869c
          CLOUDFLARE_WORKERS_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          CS_DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '' }}
