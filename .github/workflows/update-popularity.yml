name: Update Popularity Scores

on:
  schedule:
    # 02:30 UTC daily — after Cloudflare's day boundary rolls over
    - cron: '30 2 * * *'
  workflow_dispatch:   # allow manual trigger from the Actions tab

permissions:
  contents: write      # needed to commit popularity.json back to main

jobs:
  update-popularity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: scripts/build_catalog.py shells out to
          # `git log --follow` per file for created/updated dates; a shallow
          # checkout would make every sheet look freshly created.
          fetch-depth: 0

      - name: Fetch Cloudflare analytics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Zone ID for davidveksler.com (cheatsheets subdomain lives here).
          # If absent the script auto-detects the first zone on the token.
          CLOUDFLARE_ZONE_ID: 3d96473d69977c5c828b3079d9b9869c
        run: python3 fetch-popularity.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install catalog builder dependencies
        run: python3 -m pip install --upgrade pip beautifulsoup4

      - name: Rebuild catalog.json
        # Keeps `reviewed` (refresh-status.json) and `updated` (git dates)
        # current on catalog.json even on nights nobody commits by hand.
        run: python3 scripts/build_catalog.py

      # scripts/render_og_map.py (images/cheatsheets-og-portfolio.png) is a
      # manual step, not run here: it needs PHP plus a full Playwright
      # Chromium download, neither of which this job installs today, and
      # would meaningfully slow down a job that otherwise finishes in
      # seconds. If PHP + `playwright install chromium` ever become cheap
      # enough to add here, the step is:
      #
      # - name: Set up PHP
      #   uses: shivammathur/setup-php@v2
      #   with:
      #     php-version: "8.3"
      # - name: Install Playwright
      #   run: python3 -m pip install playwright && python3 -m playwright install --with-deps chromium
      # - name: Regenerate the OG social preview
      #   run: python3 scripts/render_og_map.py
      #
      # Until then, re-run it by hand per docs/marketing.md > "Social preview
      # image (OG)" and commit the PNG.

      - name: Commit updated scores
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add popularity.json catalog.json
          # Only commit if something actually changed
          git diff --staged --quiet || \
            git commit -m "chore: update popularity scores [skip ci]"
          git push
