# 404 for repo internals that `git push production` checks out into the docroot.
#
# Deployed to /var/www/cheatsheets.davidveksler.com/conf/nginx/internal-paths.conf,
# which the vhost pulls in via `include .../conf/nginx/*.conf;` AFTER
# common/locations-wo.conf. Tracked here because the server has no backups of
# its own. Apply with:
#
#   scp conf/nginx/internal-paths.conf johngalt@198.211.102.9:/tmp/
#   ssh johngalt@198.211.102.9 'sudo install -o root -g root -m 644 /tmp/internal-paths.conf /var/www/cheatsheets.davidveksler.com/conf/nginx/ && rm /tmp/internal-paths.conf && sudo nginx -t && sudo systemctl reload nginx'
#
# Until 2026-09-23 marketing drafts, runbooks, specs, deploy scripts and
# AGENTS.md all answered 200. Blocked here: the internal directories, every
# .md/.py/.ps1, a few named root files, and root dotfiles.
#
# Why prefix `^~` and `=` locations instead of regexes: locations-wo.conf is
# included first and its regex blocks win by order, so a regex here can never
# beat its `\.json$` cache rule (that rule is why /.metadata-cache.json and
# /marketing/*.json were served despite WordOps' own dotfile deny). Exact `=`
# matches are checked before everything, and a `^~` prefix that is the longest
# match skips regex evaluation entirely. The one regex below only catches
# extensions no earlier regex matches.
#
# Stays public: sheets (*.html), their root .json data files, catalog.json,
# llms.txt, llms-full.txt, robots.txt, sitemap.php, images/, LICENSE, and the
# newsletter archive pages newsletter/YYYY-MM.html (docs/newsletter.md §3).
# Two internal files are deliberately public because sheets link to them as
# provenance; add an `=` exception here before linking to any other one.

# --- Internal directories ------------------------------------------------
location ^~ /docs/       { return 404; }
location ^~ /marketing/  { return 404; }
location ^~ /TODO/       { return 404; }
location ^~ /scripts/    { return 404; }
location ^~ /deploy/     { return 404; }
location ^~ /conf/       { return 404; }
# PHP include files; index.php etc. `require` them from disk, never over HTTP.
location ^~ /lib/        { return 404; }

# Newsletter: only the public archive pages. Digest/broadcast JSON and the
# *.email.html render stay internal. The .html cache header is repeated
# because `^~` skips cache-control.conf's `\.html$` regex.
location ^~ /newsletter/ {
    location ~ "^/newsletter/[0-9]{4}-[0-9]{2}\.html$" {
        add_header Cache-Control "public, max-age=1800" always;
        try_files $uri =404;
    }
    return 404;
}

# --- Root dotfiles -------------------------------------------------------
# WordOps denies these with a 403 unless an earlier regex (\.json$) serves
# them first. 404 everything under "/." except .well-known.
location ^~ /.            { return 404; }
location ^~ /.well-known/ { try_files $uri =404; }

# --- Named root internals ------------------------------------------------
location = /AGENTS.md             { return 404; }
location = /SEO_PROMPT.txt        { return 404; }
location = /requirements.txt      { return 404; }
location = /check-category-map.php { return 404; }

# --- Deliberate public exceptions (linked from sheets) -------------------
# how-do-rainbows-work.html: "Reproduction and error record".
location = /docs/how-do-rainbows-work-production.md {
    types { } default_type "text/plain; charset=utf-8";
    try_files $uri =404;
}
# why-is-grass-green.html: "the script that turns the tabulated ... data".
location = /scripts/grass_green/build_spectra.py {
    types { } default_type "text/plain; charset=utf-8";
    try_files $uri =404;
}

# --- Internal file types anywhere else -----------------------------------
# No sheet is .md/.py/.ps1; no earlier regex matches these extensions.
location ~* \.(md|py|ps1)$ { return 404; }
