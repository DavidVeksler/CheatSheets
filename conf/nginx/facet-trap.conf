# Explorer facet crawl trap: 302 scraper traversal of filter/sort/view URLs.
#
# Deployed to /var/www/cheatsheets.davidveksler.com/conf/nginx/facet-trap.conf,
# which the vhost pulls in via `include .../conf/nginx/*.conf;` (server context).
# Tracked here because the server has no backups of its own. Apply with:
#
#   scp conf/nginx/facet-trap.conf johngalt@198.211.102.9:/tmp/
#   ssh johngalt@198.211.102.9 'sudo install -o root -g root -m 644 /tmp/facet-trap.conf /var/www/cheatsheets.davidveksler.com/conf/nginx/ && rm /tmp/facet-trap.conf && sudo nginx -t && sudo systemctl reload nginx'
#
# Why: every explorer page links to every further shape/fresh/sort/interactive/
# view combination, so the URL space is combinatorial. In the week to
# 2026-09-20, 664k of 701k requests were such URLs; ~580k came from a
# residential-proxy scraper farm (~54k IPs, ~2,000 requests each over ~4.5 h,
# rotating Chrome 121-125 UAs, Referer = our homepage) that ignores robots.txt
# and is too slow per IP for limit_req. Each hit ran PHP and sent 170-350 KB.
#
# Rule: a filter URL on the explorer (/, /index.php, or a /<slug> hub) that is
# requested WITH our own page as Referer and WITHOUT the cs_js cookie gets a
# bare 302 to the same path minus the query string. Real visitors never send
# that combination: index.php's JS intercepts every facet/sort/view click
# (history.replaceState, no request) and sets cs_js=1 on load, which also
# covers reloads and Back, where the browser replays the original Referer.
# Shared links and bookmarks (external or empty Referer) are untouched. The
# cost: a no-JS visitor clicking a filter lands on the unfiltered page.
#
# robots.txt disallows the same parameters for crawlers that obey it, and the
# links carry rel="nofollow".

set $cs_facet_trap "";
if ($args ~* "(^|&)(shape|fresh|sort|interactive|view)=") {
    set $cs_facet_trap "F";
}
if ($uri ~ "^/(index\.php|[a-z0-9-]+)?$") {
    set $cs_facet_trap "${cs_facet_trap}P";
}
if ($http_referer ~* "^https?://cheatsheets\.davidveksler\.com/") {
    set $cs_facet_trap "${cs_facet_trap}R";
}
if ($cookie_cs_js = "1") {
    set $cs_facet_trap "${cs_facet_trap}C";
}
if ($cs_facet_trap = "FPR") {
    return 302 $uri;
}
