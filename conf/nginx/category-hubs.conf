# Category hub URLs: /<slug> -> index.php?hub=<slug>
#
# Deployed to /var/www/cheatsheets.davidveksler.com/conf/nginx/category-hubs.conf,
# which the vhost pulls in via `include .../conf/nginx/*.conf;`. Tracked here
# because the server has no backups of its own. Apply with:
#
#   scp conf/nginx/category-hubs.conf johngalt@198.211.102.9:/var/www/cheatsheets.davidveksler.com/conf/nginx/
#   ssh johngalt@198.211.102.9 'sudo nginx -t && sudo systemctl reload nginx'
#
# The 15 category landing pages (AI & Safety, Software & DevOps, ...) used to
# live at ?cat=<Category>. Search Console collected them under three spellings
# (%20, +, and the old index.php?category=) and none of them ranked. They now
# live at one slug each, declared in category-hubs.json, e.g. /ai-safety.
#
# The rule is generic on purpose: any single-segment, extensionless path that
# is not a real file is handed to index.php, which resolves the slug against
# category-hubs.json. Adding a category never needs an nginx change. An
# unknown slug gets a real 404 from index.php (status 404, noindex), and a
# slug that matches an existing sheet (/dotnet-cheatsheet, which people type
# and search engines show) 301s to the .html file.
#
# `try_files $uri` first so any extensionless real file (LICENSE) still serves.
# A regex location beats the `location /` prefix block in php-routing.conf and
# does not overlap the `\.php$` and `\.html$` blocks (they need a dot).
location ~ "^/([a-z0-9][a-z0-9-]*)$" {
    try_files $uri /index.php?hub=$1&$args;
}

# One URL per hub: the trailing-slash spelling redirects to the bare slug.
location ~ "^/([a-z0-9][a-z0-9-]*)/$" {
    return 301 /$1;
}
